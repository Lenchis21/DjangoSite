{% extends "app/layout.html" %}
{% load static %}

{% block content %}
<h2 class="title">{{ title }}</h2>

{% for post in posts %}
<div class="mb-4">
    <!-- Заголовок по центру -->
    <h2 class="subtitle text-center">{{ post.title }}</h2>

    <!-- Дата слева -->
    <div class="description" style="font-size: 14px; color: #888;">
        {{ post.posted }}
    </div>

    <!-- Текст с красной строкой -->
    <p class="description text-indent mt-3">{{ post.description }}</p>

    <!-- Кнопка справа -->
    <div class="text-right">
        <a class="btn-base btn-brand" href="{% url 'blogpost' parametr=post.id %}">Читать далее</a>
    </div>
</div>
<hr>
{% empty %}
<p class="description">Статей пока нет.</p>
{% endfor %}

{% endblock %}
