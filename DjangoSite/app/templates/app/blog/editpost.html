{% extends "app/layout.html" %}
{% load static %}

{% block content %}

<h2 class="title">{{ title }}</h2>

<div class="content-wrapper">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div>
            {{ blogform.as_p }}

            <button type="submit" class="btn-base btn-brand">Сохранить изменения</button>

            <a href="{% url 'blog' %}" class="btn-base btn-blue">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
